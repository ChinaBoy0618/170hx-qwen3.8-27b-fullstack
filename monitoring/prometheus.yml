# 760T 可观测 · Prometheus 配置
# 只 scrape 本机 host-net 服务，web 绑 127.0.0.1（不对公网暴露）
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    host: "760"

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # 4 张卡的 SGLang worker（--enable-metrics 已开）
  - job_name: sglang_worker
    static_configs:
      - targets:
          - "127.0.0.1:5800"   # qwen38-27b (GPU3)
          - "127.0.0.1:5801"   # qwen38-27b-gpu0 (GPU0)
          - "127.0.0.1:5802"   # qwen38-27b-gpu1 (GPU1)
          - "127.0.0.1:5803"   # qwen38-27b-gpu2 (GPU2)

  # smg 网关 metrics + 控制面
  - job_name: gateway
    static_configs:
      - targets: ["127.0.0.1:29010"]

  # JSON 桥接 (new-api perf-metrics -> Prometheus 文本)
  - job_name: json_bridge
    static_configs:
      - targets: ["127.0.0.1:19011"]

  # GPU 硬件指标 (nvidia-smi 轮询 -> Prometheus 文本, 温度/功耗/利用率/显存/时钟)
  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:19012"]
